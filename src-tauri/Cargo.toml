[package]
name = "clauracle"
version = "0.1.5"
edition = "2021"

[lib]
name = "clauracle_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["unstable"] } # unstable: child webview (in-app browser)
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2" # 2nd launch → focus the running window
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] } # keep key order when editing ~/.claude/settings.json
tokio = { version = "1", features = ["process", "io-util", "sync", "time", "macros", "rt"] }
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"] }
ureq = "2"
regex = "1"
portable-pty = "0.8"
dirs = "5"
qrcode = { version = "0.14", default-features = false, features = ["svg"] } # Browser tab: phone-preview QR

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_Storage_FileSystem"] } # already in the tree via tauri: kill-on-close job for children

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
