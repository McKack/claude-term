<html lang="en">
<head>

<title>Clauracle</title>
<style>

:root[data-theme=dark] { --bg:#161618; --side:#1c1c1f; --card:#232326; --line:#2c2c30; --line2:#3a3a3f; --text:#ededef;

  --hover:#2a2a2e; --code:#1c1c1f; --err:#ff7b6e; --ok:#5fd08e; --shadow:0 1px 2px #00000040, 0 4px 16px #00000030; color-scheme:dark; }
/* Mono accent: pure black/white, high contrast (utilitarian); keep surfaces in sync with MONO in JS */

  --primary:#000; --primary2:#333; --ink:#fff; --shadow:none; }
:root.mono[data-theme=dark] { --bg:#000; --side:#000; --card:#000; --line:#444; --line2:#fff; --text:#fff; --dim:#ddd; --faint:#aaa; --hover:#1c1c1c;
  --code:#0d0d0d; --primary:#fff; --primary2:#ccc; --ink:#000; }
/* corners (Appearance): soft = the stylesheet; square = none; round = bigger on the main containers */
:root.c-square *:not(.av):not(.swatch):not(img):not(input[type=range]) { border-radius:0 !important; }
:root.c-round :is(.box, .menu, .termcard) { border-radius:20px !important; } :root.c-round #composer { border-radius:26px !important; }
:root.c-round dialog { border-radius:30px !important; } :root.c-round :is(input:not([type=range]), select, .seg, .seg button) { border-radius:99px !important; }
/* Appearance: no frosted glass (cheaper to draw), no motion */

.nomotion *, .nomotion *::before, .nomotion *::after { animation:none !important; transition:none !important; }
#log .old { opacity:.45; transition:opacity .2s; } #log .old:hover { opacity:.85; } /* sessions before the last clear */
.swatch { width:26px; height:26px; border-radius:50%; border:2px solid var(--bg); box-shadow:0 0 0 1px var(--line2); cursor:pointer; padding:0; }
.swatch.on { box-shadow:0 0 0 2px var(--text); }
* { box-sizing:border-box; } [hidden] { display:none !important; }
html, body { height:100%; }
body { margin:0; display:grid; grid-template-columns:auto minmax(0,1fr) auto; grid-template-rows:minmax(0,1fr) auto; background:var(--bg); color:var(--text);
  font:14px/1.55 system-ui,-apple-system,"Segoe UI Variable Text","Segoe UI",sans-serif; overflow:hidden; user-select:none; -webkit-font-smoothing:antialiased; }

.btn:hover { background:var(--hover); } .btn:disabled { opacity:.45; cursor:default; }

.ib:hover { background:var(--hover); color:var(--text); } .ib.on { color:var(--accent); background:var(--soft); }

input:focus, select:focus, textarea:focus { border-color:var(--accent); }
input[type=checkbox], input[type=radio] { accent-color:var(--accent); }
.dim { color:var(--dim); } .faint { color:var(--faint); } .err { color:var(--err); } .ok { color:var(--ok); } small { font-size:12px; }
.row { display:flex; gap:8px; align-items:center; } .wrap { flex-wrap:wrap; } .grow { flex:1; min-width:0; }
.label { font-size:11.5px; font-weight:600; letter-spacing:.06em; text-transform:uppercase; color:var(--faint); }
.btn.cxab { font-size:11.5px; font-weight:600; letter-spacing:.06em; text-transform:uppercase; color:var(--faint); } .btn.cxab:hover { color:var(--accent); }

.mono { font-family:ui-monospace,"Cascadia Code",Consolas,monospace; }

.sw input:checked + i { background:var(--accent); } .sw input:checked + i::after { left:16px; }

/* sidebar */

.side-head { display:flex; align-items:center; gap:2px; padding:8px 8px 6px 10px; }

#graph .ghd { display:flex; align-items:center; padding:2px 4px 2px 10px; } #graph .ginfo { opacity:.6; } #graph .gre { color:#cfd6e4; } #graph .faint { padding:10px; }

#graph .tm div.on { outline:2px solid #fff; outline-offset:-2px; z-index:1; } #graph .gdet { max-height:45%; overflow:auto; padding:6px 10px; border-top:1px solid #ffffff1a; line-height:1.5; }
#graph .gdet .row { display:flex; gap:8px; } #graph .gdet .row > a { flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; } #graph .gdet a { color:#8ab4ff; cursor:pointer; } #graph .dim { opacity:.6; }
.tree div.on { background:var(--soft); color:var(--text); }
#projects { flex:1; overflow:auto; padding:2px 8px; }
.proj { display:flex; gap:10px; align-items:center; padding:7px 9px; border-radius:9px; cursor:pointer; transition:background .12s; }
.proj:hover { background:var(--hover); } .proj.on { background:var(--card); box-shadow:var(--shadow); }

.av.lg { width:44px; height:44px; font-size:16px; }
.av.ai { background:#fff; } .av.ai svg { width:68%; height:68%; } :root[data-theme=dark] .av.ai { background:#262624; }
.stack { display:inline-flex; flex:none; } .stack > * + * { margin-left:-9px; } .stack .more { background:var(--hover); color:var(--dim); }

.acard .who { display:flex; gap:10px; align-items:center; } .acard .who b { display:block; } .acard h5 { margin:4px 0 0; font-size:11px; color:var(--faint); text-transform:uppercase; letter-spacing:.06em; }

/* main */
#main { display:flex; flex-direction:column; min-width:0; min-height:0; }
#head { display:flex; align-items:center; gap:10px; padding:10px 8px; min-height:54px; position:relative; z-index:3; pointer-events:none; }
#head > * { pointer-events:auto; } /* header floats over the log (chat scrolls up under it, see #log margin/mask) */
#head .title { font-weight:600; font-size:15px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
#branch { cursor:pointer; } #branch:hover { color:var(--text); border-color:var(--line2); }
#branch { font-size:12px; color:var(--dim); background:var(--side); border:1px solid var(--line); padding:1px 8px; border-radius:99px; white-space:nowrap; }
.seg { display:inline-flex; background:var(--side); border:1px solid var(--line); border-radius:9px; padding:2px; }

.seg button.on { background:var(--card); color:var(--text); box-shadow:var(--shadow); }

.msg { max-width:100%; }
.msg.user { align-self:flex-end; max-width:82%; background:var(--side); border:1px solid var(--line); padding:9px 14px; border-radius:16px 16px 4px 16px; white-space:pre-wrap; }
.msg.user .tk { margin-left:6px; font-size:11px; color:var(--faint); white-space:nowrap; } .msg.user .tk.read { color:#34b7f1; letter-spacing:-3px; padding-right:3px; } .msg.user .tk.fail { color:var(--err); font-weight:700; } .msg.user .tk .i { width:11px; height:11px; vertical-align:-1px; }
.rpill { display:inline-flex; align-items:center; gap:4px; padding:0 8px 0 6px; border-radius:99px; color:var(--accent); background:color-mix(in srgb, var(--accent) 14%, transparent); box-shadow:inset 0 0 0 1px color-mix(in srgb, var(--accent) 45%, transparent); } .rpill svg { width:1em; height:1em; flex:none; }
#pback .fic { position:relative; } #pback .fic svg { position:absolute; left:0; top:50%; width:.8em; height:.8em; transform:translateY(-50%); color:var(--accent); } /* #227 icon over the em-space slot */
.filedtag { margin-left:8px; font-size:11px; color:var(--dim); white-space:nowrap; }

.msg .thumbs img { width:96px; height:64px; object-fit:cover; border-radius:8px; border:1px solid var(--line); }
.crow .cb, .msg.user { min-width:0; } #log { overflow-x:hidden; } #log::-webkit-scrollbar-track { margin:52px 0 20px; } /* thumb stops short of the top mask (52px) + #dock overlap (20px) */
.crow { display:flex; gap:10px; align-items:flex-start; } .crow.user { flex-direction:row-reverse; }
.crow > .av { border-color:var(--bg); } /* 26px = the name row's height: avatar sits in line with name + time */
.crow .cm { min-height:26px; } .crow.claude .msg.claude { background:var(--card); border:1px solid var(--line); padding:9px 14px; border-radius:4px 16px 16px 16px; }
.crow.user .msg.user { border-radius:16px 4px 16px 16px; } /* hard corner points at the avatar, top */ .crow > :is(img, svg).av { background:var(--card); padding:3px; border:1px solid var(--line); }
.crow .cb { min-width:0; display:flex; flex-direction:column; gap:3px; } .crow.claude .cb { flex:1; max-width:88%; } .crow.user .cb { align-items:flex-end; max-width:88%; } /* both leave room at the far end */
.crow .cm { font-size:11.5px; color:var(--faint); display:flex; gap:7px; align-items:center; } .crow .cm b { color:var(--dim); font-weight:600; }
#log:not(.term) .col > .tools, #log:not(.term) .col > .msg.err { margin-left:36px; } /* under Claude's bubble, past its avatar */
/* reply to the terminal card above: └ spine from the card (avatar centre x = -23px) into a one-line "what ran" header */
/* reply to a terminal card: a narrower card tucked under it (flat top, card's shadow overlaps), reply icon on the left */
.tools.termcard { position:relative; z-index:1; }
#log .crow.reply { margin:-21px 3% 0 calc(36px + 3%); } /* centred under the termcard (margin-left 36px) */ /* -12 gap -3 card margin -6 tuck */ #log .crow.reply > .av, #log .crow.reply .cm { display:none; }
#log .crow.reply .cb { flex:1; max-width:none; } #log .crow.reply .msg.claude { position:relative; border-top:0; border-radius:0 0 14px 14px; padding:12px 14px 6px 38px; line-height:20px; } /* #204 6px tucked under the card → 6px visible top = bottom */ #log .crow.reply .msg.claude > .rto + * { margin-top:0; } #log .crow.reply .msg.claude > :last-child { margin-bottom:0; } /* .rto is first child ∴ p keeps its margin */
.rto { position:absolute; left:13px; top:14.5px; color:var(--faint); cursor:pointer; line-height:0; } .rto .i { width:15px; height:15px; transform:rotate(180deg); } .rto:hover { color:var(--text); }
.termcard.flash { animation:tcflash 1.2s ease-out; } .jumphl { animation:jumphl 2.4s ease-out; border-radius:8px; } @keyframes jumphl { 0%, 55% { box-shadow:0 0 0 2px var(--accent); background:var(--soft); } } @keyframes tcflash { from { box-shadow:0 0 0 2px var(--accent); } }
.crow .msg.user { max-width:100%; } .crow.cont > .av { visibility:hidden; height:0; } .crow.cont .cm { display:none; } .crow.cont { margin-top:-4px; }
.msg.claude p { margin:.35em 0; } .msg.claude :first-child { margin-top:0; }
.msg.claude pre { background:var(--code); border:1px solid var(--line); padding:10px 12px; border-radius:10px; overflow:auto; }
.msg code, pre { font:12.5px/1.5 ui-monospace,"Cascadia Code",Consolas,monospace; } .msg :not(pre)>code { background:var(--code); padding:1px 5px; border-radius:5px; }
code.hl { color:var(--accent); background:var(--soft); padding:0 4px; border-radius:4px; font:12px ui-monospace,Consolas,monospace; }
.msg.claude a { color:var(--accent); }
.tools { display:flex; flex-direction:column; gap:2px; }
.msg.tool { font:12px ui-monospace,"Cascadia Code",Consolas,monospace; color:var(--faint); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; display:flex; gap:6px; align-items:center; }
#log:not(.term) .msg.tool { cursor:pointer; }
#log:not(.term) .msg.tool .tn { overflow:hidden; text-overflow:ellipsis; min-width:0; text-decoration:underline dashed var(--line2); text-underline-offset:3px; }
#log:not(.term) .msg.tool:hover .tn { color:var(--dim); text-decoration-color:var(--faint); }
.msg.tool .tp { flex:none; display:inline-flex; gap:2px; align-items:center; font-size:11px; padding:0 6px; border-radius:99px; background:var(--soft); color:var(--accent); }
.msg.tool .tp .i { width:11px; height:11px; }
.viewer { width:92vw; height:90vh; display:grid; grid-template-rows:auto minmax(0,1fr); }
.vbar { display:flex; gap:8px; align-items:center; padding:10px 12px 10px 18px; border-bottom:1px solid var(--line); }
.vname { font-size:13px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; min-width:0; }
.vstage { position:relative; display:grid; place-items:center; padding:14px; min-height:0; overflow:hidden; }
.vstage > img, #edC { max-width:100%; max-height:calc(90vh - 90px); object-fit:contain; border-radius:6px; display:block; }
#edWrap { position:relative; } #edC { cursor:crosshair; touch-action:none; }
.varrow { position:absolute; top:50%; translate:0 -50%; width:40px; height:40px; border-radius:50%; background:var(--card); box-shadow:var(--shadow); z-index:1; }
.varrow.l { left:14px; } .varrow.l svg { rotate:180deg; } .varrow.r { right:14px; }
.ednote { position:absolute; width:240px; display:flex; align-items:flex-end; gap:4px; padding:3px 4px 3px 8px; border:2px solid; border-radius:8px; background:var(--card); }
.ednote textarea { flex:1; border:0; padding:2px 0; background:none; resize:none; min-height:0; font-size:12.5px; box-shadow:none; overflow:hidden; } .ednote .ib { width:22px; height:22px; }
.ednote.col { width:auto; padding:3px; cursor:pointer; border-radius:50%; } .ednote.col .i { width:14px; height:14px; display:block; }
.thumbs img { cursor:zoom-in; }
/* shell commands in chat: a little dark terminal window, same in both themes */
.termcard { background:color-mix(in srgb, var(--tint, #000) var(--tintm, 0%), #161514); border:1px solid color-mix(in srgb, var(--tint, #000) calc(var(--tintm, 0%) * 2), #2e2c2a); border-radius:10px; overflow:hidden; box-shadow:var(--shadow); margin:3px 0; max-width:100%; }
.termcard .tbar { display:flex; align-items:center; gap:6px; padding:6px 8px 6px 10px; background:color-mix(in srgb, var(--tint, #000) var(--tintm, 0%), #201f1d); color:var(--tc-dim); font-size:11.5px; }
.termcard .tbar i { width:10px; height:10px; border-radius:50%; background:#ff5f57; flex:none; } .termcard .tbar i:nth-child(2) { background:#febc2e; } .termcard .tbar i:nth-child(3) { background:#28c840; }
.termcard .tbar span { flex:1; text-align:center; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; min-width:0; }
/* raised bits (active tab, Copy, row hover) mix the theme tint like the card/border ∴ follow the theme, not fixed brown */

.out { background:#151412; color:#d8d4cb; border-radius:10px; padding:10px; max-height:240px; overflow:auto; font:12px/1.5 ui-monospace,Consolas,monospace; white-space:pre-wrap; margin-top:10px; user-select:text; }
.envfile { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:10px 12px; margin:0 0 12px; }
.kv { display:grid; grid-template-columns:minmax(0,1fr) auto; gap:2px 6px; padding:7px 0; border-top:1px solid var(--line); align-items:center; }
.kv .k { font:600 12.5px ui-monospace,Consolas,monospace; overflow:hidden; text-overflow:ellipsis; }
.kv .v { grid-column:1/-1; font:12px ui-monospace,Consolas,monospace; color:var(--dim); overflow-wrap:anywhere; }
.crumbs { font-size:12.5px; margin-bottom:8px; } .crumbs a { cursor:pointer; color:var(--accent); }
.pathbar { display:flex; gap:2px; align-items:center; margin:2px 0 6px; } .pathbar .ib:disabled { opacity:.35; cursor:default; }
.pathbar .crumbs { flex:1; min-width:0; margin:0 0 0 4px; padding:4px 8px; background:var(--card); border:1px solid var(--line); border-radius:8px;
  white-space:nowrap; overflow-x:auto; scrollbar-width:none; display:flex; gap:4px; font-size:12px; } .pathbar .crumbs a { color:var(--dim); } .pathbar .crumbs a:hover { color:var(--accent); }
.tree div { padding:3px 8px; border-radius:6px; cursor:pointer; font-size:13px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; display:flex; gap:6px; align-items:center; }
.tree div:hover { background:var(--hover); } .tree svg { color:var(--faint); }
/* edited-lately badge: count pill (folder, < 1 min) or dot; opacity set in badgeFiles, eased between its 5s ticks */
.tree .eb { margin-left:auto; flex:none; min-width:8px; height:8px; border-radius:99px; background:var(--accent); transition:opacity 5s linear; }
.tree .eb:not(:empty) { min-width:18px; height:16px; padding:0 5px; color:var(--ink); font-size:10.5px; font-weight:700; line-height:16px; text-align:center; }
.code { font:12.5px/1.5 ui-monospace,Consolas,monospace; background:var(--card); border:1px solid var(--line); border-radius:10px; overflow:auto; max-height:calc(100vh - 170px); counter-reset:l; }
.code pre { margin:0; padding:8px 12px 8px 0; white-space:pre; min-width:max-content; } .code.wrap pre { white-space:pre-wrap; overflow-wrap:anywhere; min-width:0; }
.code pre > div { display:grid; grid-template-columns:var(--lw) 1fr; } /* #231 one row per line: line no. = ::before (not copied), wrapped lines indent under the text */
.code pre > div::before { counter-increment:l; content:counter(l); color:var(--faint); text-align:right; padding-right:8px; margin-right:12px; border-right:1px solid var(--line); -webkit-user-select:none; user-select:none; }
#web { width:100%; height:calc(100vh - 175px); border:1px solid var(--line); border-radius:10px; background:#fff; }
/* phone preview: a 390×844 viewport (iPhone-ish) in a bezel, shrunk with zoom to fit the panel */
/* bezel = padding on a dark box (not a border: the screen's own rounded clip avoids light AA seams at the corners) */
.phone { margin:0 auto; width:414px; height:868px; padding:12px; box-sizing:border-box; border-radius:48px; background:#111; box-shadow:0 0 0 1px var(--line2), var(--shadow); }
.phone .screen { position:relative; height:100%; border-radius:36px; overflow:hidden; background:#000; display:flex; flex-direction:column; }
.phone .screen::after { content:""; position:absolute; inset:0; pointer-events:none; border-radius:inherit; background:radial-gradient(ellipse at center, transparent 62%, #0000002e 100%); }
.phone .sbar { height:30px; flex:none; display:flex; align-items:center; justify-content:space-between; padding:0 26px; color:#fff; font:600 13px system-ui, sans-serif; position:relative; }
.phone .sbar .cam { position:absolute; left:50%; top:9px; width:12px; height:12px; margin-left:-6px; border-radius:50%; background:#1a1a1a; box-shadow:inset 0 0 0 3px #050505, 0 0 0 1px #222; }
.phone .sbar .bat { width:22px; height:11px; border:1.5px solid #fff; border-radius:3px; position:relative; box-sizing:border-box; background:linear-gradient(90deg, #fff 70%, transparent 70%) content-box; padding:1px; }
.phone .sbar .bat::after { content:""; position:absolute; right:-4px; top:2.5px; width:2px; height:4px; background:#fff; border-radius:0 1px 1px 0; }
.phone #web { flex:1; width:100%; height:auto; border:0; border-radius:0; background:#fff; }
.qr { flex:none; cursor:zoom-in; line-height:0; } .qr svg { padding:4px; background:#fff; border-radius:6px; shape-rendering:crispEdges; }
.qr.big { flex-basis:100%; cursor:zoom-out; } .qr.big svg { width:100%; height:auto; } .qrbox:has(.qr.big) { flex-wrap:wrap; }
.qrbox { display:flex; gap:12px; align-items:center; margin-bottom:10px; }

/* dialogs */
dialog { border-radius:20px; color:var(--text); padding:0; } dialog:focus, dialog:focus-visible { outline:none; }
/* thin rounded scrollbars instead of the classic Windows ones with arrows */
::-webkit-scrollbar { width:10px; height:10px; } ::-webkit-scrollbar-button { display:none; } ::-webkit-scrollbar-track { background:transparent; }
::-webkit-scrollbar-thumb { background:color-mix(in srgb, var(--text) 18%, transparent); border-radius:99px; border:3px solid transparent; background-clip:content-box; }
::-webkit-scrollbar-thumb:hover { background-color:color-mix(in srgb, var(--text) 32%, transparent); }
dialog::backdrop { background:#0000004d; backdrop-filter:blur(2px); }
/* settings: one window, icon tabs across the top (macOS System Settings style) */
.prefs { width:min(920px,94vw); height:min(700px,88vh); display:grid; grid-template-rows:auto 1fr auto; }
.prefs .sfoot { display:flex; align-items:center; gap:10px; padding:10px 16px; border-top:1px solid var(--line); } .prefs .sfoot .row { justify-content:center; gap:8px; } .prefs .sfoot select { max-width:200px; }
.prefs .tbar { display:flex; justify-content:center; gap:2px; padding:10px 48px 8px; border-bottom:1px solid var(--line); position:relative; }
.prefs .tbar button { display:flex; flex-direction:column; align-items:center; gap:4px; min-width:78px; padding:7px 8px 5px; border:0; background:none;
  border-radius:12px; color:var(--dim); font-size:11.5px; cursor:pointer; transition:background .12s, color .12s; }
.prefs .tbar button svg { width:22px; height:22px; stroke-width:1.6; } .prefs .tbar button:hover { background:var(--hover); }
.prefs .tbar button.on { background:var(--soft); color:var(--accent); }
.prefs .tbar .x { position:absolute; right:10px; top:10px; }
.prefs .body { overflow:auto; padding:20px 28px; display:flex; flex-direction:column; }
.prefs .body h2 { margin:0 0 4px; font-size:18px; } .prefs .body > p.dim:first-of-type { margin-top:0; }
.split { display:grid; grid-template-columns:190px 1fr; gap:24px; align-items:start; }
.plist { position:sticky; top:0; display:flex; flex-direction:column; gap:2px; }
.plist button { display:flex; gap:8px; align-items:center; border:0; background:none; text-align:left; padding:7px 10px; border-radius:10px; cursor:pointer; color:var(--dim); }
.plist button:hover { background:var(--hover); } .plist button.on { background:var(--soft); color:var(--text); }
.plist button span { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.small-dlg { width:min(520px,92vw); padding:20px; }
.check { display:flex; gap:10px; align-items:center; padding:6px 0; border-bottom:1px solid var(--line); } .check:last-child { border:0; }
.box { border:1px solid var(--line); border-radius:12px; padding:4px 14px; margin:8px 0 14px; }
.grid2 { display:grid; grid-template-columns:150px 1fr; gap:10px 14px; align-items:center; margin:8px 0 14px; }
.acct { border:1px solid var(--line); border-radius:12px; margin:10px 0; } .acct > summary { padding:12px 14px; cursor:pointer; list-style:none; display:flex; gap:10px; align-items:center; }
.acct > div { padding:0 14px 14px; } .acct .chev { display:inline-flex; color:var(--faint); transition:rotate .15s; } .acct .chev svg { width:14px; height:14px; } .acct[open] .chev { rotate:90deg; }
.ordiv { display:flex; align-items:center; gap:10px; margin:14px 0; color:var(--faint); font-size:12px; text-transform:uppercase; letter-spacing:.08em; }
.ordiv::before, .ordiv::after { content:""; flex:1; border-top:1px solid var(--line2); } .acct[open] > summary { border-bottom:1px solid var(--line); margin-bottom:10px; }
.agent { border:1px solid var(--line); border-radius:12px; padding:12px 14px; margin:10px 0; display:grid; gap:8px; }
.agent textarea { width:100%; min-height:54px; font-size:13px; }
</style>

<script>
const T = window.__TAURI__, call = (cmd, args) => T.core.invoke(cmd, args);

const ctx = (() => { try { return JSON.parse(localStorage.ctx || '{}'); } catch { return {}; } })();

// token estimates per pid: now = context tokens (get_context_usage), drop = Σ context cleared by clear-continue,
// saved += drop per finished turn (without the clears each turn would re-read it). ponytail: per turn, not per API call → low-ball
const TOK = (() => { try { return JSON.parse(localStorage.tok || '{}'); } catch { return {}; } })();
const tk = pid => TOK[pid] ||= {now: 0, drop: 0, saved: 0};
const kt = n => n >= 1e6 ? (n / 1e6).toFixed(1) + 'M' : Math.round(n / 1e3) + 'k';
// AI-button cost: one read of the current context + the prompt (chars/4); tool calls repeat it → "+"
const estTok = (txt = '') => `≈ ${kt(tk(cur).now + txt.length / 4 + 2e3)}+ tokens (current context + prompt)`;
const hand = {}, team = {}, logs = {}, busy = {}, live = {}, builds = {}, hiddenQs = {}, qsOpen = {}, atts = {}, texts = {}, queue = {};
let draftsLoaded = false;
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const icon = n => `<svg class="i"><use href="#i-${n}"/></svg>`;
const P = (id = cur) => S.projects.find(p => p.id === id);
const nick = id => (S.accounts.find(a => a.id === id) || {nick: id}).nick;
// #216 named by what they do (clearing between tasks = how, always on); context-limit handover = AI card slider, every mode
const MODES = {off: ['Just chat', 'No task list: tasks run only when you ask'], manual: ['One at a time', 'Finishes a task, then waits for your Start'],
  auto: ['Keep going', 'Works through the task list, fresh context per task, until a limit, a question or an empty list'], auto_answer: ['Keep going + answer', 'Like Keep going, and answers what it can itself; holds only real decisions']};
const MODELS = {'': 'Default', fable: 'Fable', opus: 'Opus', sonnet: 'Sonnet', haiku: 'Haiku'};
const EFFORTS = {'': 'Default', low: 'Low', medium: 'Medium', high: 'High', xhigh: 'Extra high', max: 'Max'};

// ---- permission / interactive question (inline, so other projects keep going) ----
function askCard(e) {
  const d = document.createElement('div'), i = e.input;
  d.className = 'card';
  // answered permission → note: "<shield> Tool: Allowed for 24 h" + answer time on top like other notes (#54)
  if (e.done) { d.className = 'msg note'; d.innerHTML = `${icon('shield')} ${esc(e.tool)}: ${esc(e.done)}`; if (e.doneAt || e.ts) d.dataset.ts = tm(e.doneAt || e.ts); return d; }
  if (e.tool === 'AskUserQuestion') {
    d.classList.add('qs');
    d.innerHTML = `<h4>Your AI asks</h4>` + (i.questions || []).map((q, n) => `<div class="q"><div><span class="num">${n + 1}</span><b>${esc(q.question)}</b></div>
      ${(q.options || []).filter(notOther).map(o => `<label class="choice"><input type="${q.multiSelect ? 'checkbox' : 'radio'}" name="a${n}" value="${esc(o.label)}"><span>${esc(o.label)}<small class="dim">${esc(o.description || '')}</small></span></label>`).join('')}
      <label class="choice"><input type="${q.multiSelect ? 'checkbox' : 'radio'}" name="a${n}" value="__other"><span>Other</span></label>
      <input class="other" placeholder="Your own answer" oninput="this.previousElementSibling.querySelector('input').checked = !!this.value"></div>`).join('')
      + `<div class="btns"><button class="btn ghost" data-a="0">Dismiss</button><button class="btn primary" data-a="1">Answer</button></div>`;
  } else {
    const body = i.command || (i.file_path ? i.file_path + '\n\n' + (i.new_string || i.content || '') : JSON.stringify(i, null, 2));
    // depth ("What?"): Bash grep -c → Bash | Bash grep | Bash grep -c; rules "Bash(grep:*)" (CLI syntax), medium default
    // compound cmd (cd x; git y | grep z) → one rule per part, all needed (claude::allowed splits the same way)
    // shell syntax (loops/ifs/subshells/functions) → no prefix rules, only plain "Bash"; 2nd word only if plain
    // (subcommand/flag/path: git commit, grep -n, cd …/x), never a quoted arg or glob
    const segs = e.tool === 'Bash' ? splitCmd(i.command || '') : [];
    const parts = segs.some(s => /^(for|while|until|if|then|else|elif|do|done|fi|case|esac|function|select)\b|^[({]|^\w+\s*\(\)/.test(s)) ? []
      : segs.map(s => { const w = s.split(/\s+/); return w[1] && /^[^'"`$*?{}()<>&|;]{1,60}$/.test(w[1]) ? w.slice(0, 2) : w.slice(0, 1); });
    // label only: long paths → …/last folder (rule keeps the full path); > 4 commands → "+N more"
    const short = s => s.length > 24 && /[\\/]/.test(s) ? '…/' + s.replace(/["']/g, '').split(/[\\/]/).filter(Boolean).pop() : s;
    const lvl = n => { const ws = [...new Map(parts.map(w => [w.slice(0, n).join(' '), w.slice(0, n)])).values()], ls = ws.map(w => w.map(short).join(' '));
      return [ws.map(w => `${e.tool}(${w.join(' ')}:*)`), `${e.tool} ${ls.slice(0, 4).join(' + ')}${ls.length > 4 ? ` +${ls.length - 4} more` : ''}`]; };
    rules = [[[e.tool], e.tool === 'Bash' ? 'Bash (any command)' : e.tool], ...(parts.length ? [lvl(1)] : []), ...(parts.some(w => w.length > 1) ? [lvl(2)] : [])];
    rule = rules[Math.min(1, rules.length - 1)][0];
    d.classList.add('perm');
    d.innerHTML = `<h4><span class="edot"></span>Allow ${esc(e.tool)}?</h4><pre class="sel">${esc(body)}</pre><input class="deny" placeholder="Optional: why not, or what to do instead" style="width:100%">
      <div class="btns"><button class="btn ghost" data-a="0">Deny</button><button class="btn" data-m>Allow…</button><button class="btn primary" data-a="1">Allow now</button></div>`;
    // Allow… = dropdown: duration → (Bash only) what to allow, as a hover submenu
    const pick = (a, r) => () => { rule = r; answer(a); };
    d.querySelector('[data-m]').onclick = ev => menuAt(ev.currentTarget, [['3', 'This session', 'Until this session restarts or is cleared'],
      ['5', 'For 24 hours', 'In this project'], ['2', 'Always', 'In this project; undo in the project manager']]
      .map(([a, label, hint]) => rules.length > 1 || e.tool === 'Bash' ? {label, hint, items: [{title: 'What to allow'}, ...rules.map(([r, l]) => ({label: l, run: pick(a, r)}))]} : {label, hint, run: pick(a, rule)}));
  }
  var rules, rule;
  d.querySelectorAll('[data-a]').forEach(b => b.onclick = () => answer(b.dataset.a));
  function answer(a) {
    const allow = a !== '0', answers = {};
    // 2 = always, 5 = 24 h ("rule@unix secs", claude::rule_hit): this project's allow list
    if (a === '2' || a === '5') { const p = P(e.pid) || P(), r = rule.map(x => a === '5' ? `${x}@${Math.floor(Date.now() / 1000) + 86400}` : x);
      call('update_project', {pid: p.id, changes: {allow: [...new Set([...(p.allow || []), ...r])]}}).then(refresh); }
    (i.questions || []).forEach((q, n) => answers[q.question] = [...d.querySelectorAll(`[name=a${n}]:checked`)]
      .map(x => x.value === '__other' ? x.closest('.q').querySelector('.other').value : x.value).join(', '));
    call('answer_ask', {id: e.id, answer: {allow, answers, session: a === '3', rule, note: d.querySelector('.deny')?.value || ''}});
    if (i.questions && allow) { e.kind = 'answered'; e.qa = i.questions.map(q => [q.question, answers[q.question], '']); d.replaceWith(answeredCard(e)); return; } // #9
    e.done = {0: 'Denied', 1: 'Allowed once', 3: 'Allowed for this session', 5: 'Allowed for 24 h', 2: 'Always allowed'}[a] || 'Allowed';
    e.doneAt = new Date().toISOString();
    d.replaceWith(askCard(e));
  }
  return d;
}

    tm.innerHTML = out.map(([f, x, y, w, h]) => `<div data-i="${F.indexOf(f)}" style="left:${x}px;top:${y}px;width:${w}px;height:${h}px;background:${col(f)}" title="${esc(f[0])}\n${mb(f[1])} · ${lines(f[2])} changed">${w > 34 && h > 13 ? esc(f[0].split('/').pop()) : ''}</div>`).join('');
    show();
  };
  new ResizeObserver(lay).observe(tm);
}

const webUrl = {}, QRS = new Map(); // QR svg per url (cached)

async function drawWeb() {
  BROWSERS ||= await call('browsers');

  const b0 = BROWSERS[0];
  HOMEPG ??= b0 ? await call('homepage', {exe: b0.exe, profile: b0.profiles[0]?.dir || ''}).catch(() => '') : '';
  const url = webUrl[cur] || (builds[cur]?.out.match(/https?:\/\/(localhost|127\.0\.0\.1)(:\d+)?[^\s]*/g) || []).pop() || HOMEPG || 'http://localhost:3000';
  webUrl[cur] = url;

    `<option value='${esc(JSON.stringify([b.exe, p.dir]))}'>${esc(b.name)} · ${esc(p.name)}${p.user ? ' (' + esc(p.user) + ')' : ''}</option>`)).join('');
  let phone = '';
  if (webPhone) { // the phone needs this PC's LAN address, not localhost (dev server must listen on 0.0.0.0, e.g. vite --host)
    LAN ??= await call('lan_ip');
    const purl = LAN ? url.replace(/\/\/(localhost|127\.0\.0\.1)/, '//' + LAN) : url, local = purl !== url;

    const fix = off ? `<div class="row" style="margin-bottom:8px"><small class="dim grow">Not reachable from the phone: the dev server only listens on localhost.</small>
      <button class="btn" onclick="putPrompt('Make the dev server listen on all interfaces (0.0.0.0, e.g. vite --host) so a phone on the same Wi-Fi can open ${esc(purl)}')">Fix with AI</button></div>` : '';
    // QR: 2 screen px per module; click → fills the panel width for scanning, click again → back
    phone = `<div class="qrbox"><div class="qr" title="Click to enlarge for scanning" onclick="this.classList.toggle('big')">${QRS.get(purl)}</div><div class="grow" style="min-width:0"><small class="dim">Scan on your phone${local ? ' (same Wi-Fi)' : ''}</small>

  $('rbody').innerHTML = `<div class="row" style="margin-bottom:8px"><button class="ib" id="wgo" title="Reload" onclick="webGo()">${icon('loop')}</button>
    <input id="wurl" class="grow sel mono" style="min-width:0" value="${esc(url)}" onkeydown="if(event.key==='Enter')webGo()"
      oninput="const g = this.value !== webUrl[cur]; $('wgo').innerHTML = icon(g ? 'go' : 'loop'); $('wgo').title = g ? 'Go' : 'Reload'">
    <span class="seg"><button class="${webPhone ? '' : 'on'}" title="Desktop" onclick="webPhone=false; drawWeb()">${icon('monitor')}</button><button class="${webPhone ? 'on' : ''}" title="Phone" onclick="webPhone=true; drawWeb()">${icon('phone')}</button></span></div>
    ${phone}${webPhone ? `<div class="phone"><div class="screen"><div class="sbar"><b id="ptime">${new Date().toTimeString().slice(0, 5)}</b><i class="cam"></i><span class="bat"></span></div>
      <div id="web"></div></div></div>` : `<div id="web"></div>`}`
    + `<div class="row" style="margin-top:8px"><small class="dim">Open in</small><select id="bsel" class="grow">${opts || '<option value="">no Chromium browser found</option>'}</select>
      <button class="btn" onclick="openIn()">Open</button></div>`;
  const ph = $('rbody').querySelector('.phone'); // fit the 414px-wide phone into the panel (zoom keeps its 390px viewport)
  if (ph) ph.style.zoom = Math.min(1, ($('rbody').clientWidth - 4) / 414, (innerHeight - 330) / 868);

}

// native webview follows #web's box; hidden when #web is gone or a dialog/menu is open (a native view covers any HTML)
// ponytail: 4×/s poll, catches resize/rail/tabs/modals in one place; ResizeObserver+events if lag shows
let webAt = '', webNav = '';
function syncWeb() {
  const el = $('web'), z = LOOK.scale / 100, r = el?.getBoundingClientRect();
  const cover = [...document.querySelectorAll('dialog[open], :popover-open')].some(e => e.id !== 'tip');
  const rect = r?.width && r.height && !cover ? [r.x, r.y, r.width, r.height].map(v => v * z) : null;
  const ph = el?.closest('.phone'), wz = ph ? z * (+ph.style.zoom || 1) : 1; // phone: keep its 390px viewport
  const url = webUrl[cur] || '', nav = !!rect && url !== webNav, key = JSON.stringify([rect, wz, url]);
  if (key === webAt && !nav) return; webAt = key; if (nav) webNav = url;

}

async function queueToTeam(btn) {
