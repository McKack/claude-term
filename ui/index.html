  <div id="dock" hidden><button class="npill" id="jump" hidden onclick="toEnd(true)" title="Jump to the newest"><svg class="i" style="transform:rotate(180deg)"><use href="#i-up"/></svg><span></span></button><div class="col">
    <div id="queue" hidden><div id="qrow"></div><button class="ib qnav l" title="Scroll left" onclick="qscroll(-1)"><svg class="i"><use href="#i-chev"/></svg></button><button class="ib qnav" title="Scroll right" onclick="qscroll(1)"><svg class="i"><use href="#i-chev"/></svg></button></div>
    <div id="suggest" hidden></div>
    <div id="ready" hidden><svg class="i ok"><use href="#i-loop"/></svg><span class="grow" id="readytext" onmouseenter="readyMore(this)" onclick="if (!event.target.closest('button') &amp;&amp; readyMore(this)) this.classList.toggle('full')"></span><button class="btn primary sm" id="contBtn" onclick="contClick(cur)">Continue</button><button id="readyx" title="Show the whole task" onclick="$('readytext').classList.toggle('full')"></button></div>
    <div id="composer"><div id="cgrip" title="Drag to resize, double-click to fit the text"></div>
      <div id="slash" hidden></div>
      <div id="attw"><button class="aarr" onclick="attScroll(-1)"><svg class="i" style="transform:scaleX(-1)"><use href="#i-chev"/></svg></button><div id="atts" onscroll="attArr()"></div><button class="aarr r" onclick="attScroll(1)"><svg class="i"><use href="#i-chev"/></svg></button></div>
      <div id="pwrap"><div id="pback" aria-hidden="true"></div><textarea id="prompt" rows="1" placeholder="Message Clauracle..."></textarea></div>

        <button class="ib" title="Attach files" onclick="pickFiles()"><svg class="i"><use href="#i-clip"/></svg></button>
        <button class="ib" id="tSkill" title="Skills for this project" onclick="skillMenu(this)"><svg class="i"><use href="#i-sparkle"/></svg></button>
        <button class="ib" id="tCont" title="Clear & continue mode" onclick="menuAt(this, contItems())"><svg class="i"><use href="#i-loop"/></svg></button>
        <button class="ib" title="Clear & continue now: write the handover, then start fresh" onclick="call('prepare_handover', {pid:cur})"><svg class="i"><use href="#i-eraser"/></svg></button>
        <div id="status"></div><!-- #278 status row inside the composer, right-aligned ∴ composer sits lower -->
        <button class="ib" id="tWeb" onclick="S.web = !S.web; call('set_off', {item: 'web', off: !S.web, scope: 'global'}); drawChrome()"><svg class="i"><use href="#i-globe"/></svg></button>
        <button class="btn ghost sm" id="cancelEdit" hidden title="Put the queued message back, unchanged, in its place" onclick="cancelEdit()" style="margin-right:6px"><svg class="i"><use href="#i-x"/></svg>Cancel edit</button>
        <button id="send" onclick="busy[cur] && !hasInput() ? call('interrupt', {pid:cur}) : send()" title="Send (Enter)"><svg class="i"><use href="#i-up"/></svg></button>
      </div>
    </div>
